# =============================================================================
#  JARVIS OS 1.0 — MODERN HYPRLAND WAYLAND COMPOSITOR CONFIGURATION
#  Aesthetics: Apple macOS Glassmorphism + Iron Man Holographic HUD (120 FPS)
# =============================================================================

# Monitor Configuration
monitor=,preferred,auto,1

# Autostart Subsystems
exec-once = waybar -c /etc/jarvis/waybar/config -s /etc/jarvis/waybar/style.css
exec-once = /bin/jarvis-daemon
exec-once = /bin/jarvis-hud --startup-briefing
exec-once = pipewire & pipewire-pulse & wireplumber

# Environment Variables
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = OZONE_PLATFORM,wayland

# Input Configuration (Mouse, Keyboard, Touchpad)
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# General Window Appearance
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(00f3ffee) rgba(0066ffee) 45deg
    col.inactive_border = rgba(1a1a2cee)
    layout = dwindle
    allow_tearing = false
}

# Ultra-Modern Glassmorphic Decoration
decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = on
        xray = true
        ignore_opacity = false
    }

    drop_shadow = yes
    shadow_range = 24
    shadow_render_power = 4
    col.shadow = rgba(00f3ff33)
    col.shadow_inactive = rgba(00000066)

    active_opacity = 0.94
    inactive_opacity = 0.82
}

# Fluid 120 FPS Animations
animations {
    enabled = yes
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, smoothIn
    animation = workspaces, 1, 6, default
}

# Layout Rules
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# Window Rules for JARVIS HUD and Browser
windowrulev2 = float,class:^(jarvis-hud)$
windowrulev2 = pin,class:^(jarvis-hud)$
windowrulev2 = size 1020 700,class:^(jarvis-hud)$
windowrulev2 = center,class:^(jarvis-hud)$
windowrulev2 = opacity 0.96 override 0.92 override,class:^(jarvis-hud)$

windowrulev2 = opacity 0.98 override 0.95 override,class:^(chromium)$
windowrulev2 = opacity 0.98 override 0.95 override,class:^(google-chrome)$
windowrulev2 = opacity 0.98 override 0.95 override,class:^(firefox)$

# Keybindings
$mainMod = SUPER

# Application Launchers
bind = $mainMod, RETURN, exec, kitty || alacritty || xterm
bind = $mainMod, B, exec, chromium --ozone-platform=wayland --enable-features=UseOzonePlatform || google-chrome || firefox
bind = $mainMod, J, exec, /bin/jarvis-hud --toggle
bind = $mainMod, SPACE, exec, wofi --show drun -c /etc/jarvis/wofi/config -s /etc/jarvis/wofi/style.css
bind = $mainMod, M, exec, /bin/jarvis-daemon --wake-voice
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, nautilus || thunar || pcmanfm
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0

# Workspace Navigation
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Window Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
